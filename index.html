<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우울을 다루는 마음 연습</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#F5F6F8; --card:#ffffff; --ink:#2B2F3A; --sub:#636A78; --faint:#9AA0AC; --line:#E2E5EB;
    --slate:#3E4458; --slate2:#5A6179; --pale:#EEF2FB; --paleink:#34489A;
    --g1:#3F5BC4; --g2:#7558C8;
    --warnbg:#FDF1F0; --warnink:#B2463F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);
       font-size:19px;line-height:1.65;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;word-break:keep-all}
  button,input,textarea{font-family:inherit;font-size:inherit;color:inherit;letter-spacing:inherit}
  .rail{position:fixed;top:0;left:0;right:0;height:4px;background:var(--line);z-index:50}
  .rail i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g1),var(--g2));transition:width .35s}
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .top[hidden]{display:none}
  .top .btn{min-height:40px;padding:6px 14px;font-size:15px}
  .top{position:fixed;top:4px;left:0;right:0;padding:10px 24px;background:#fff;border-bottom:1px solid var(--line);z-index:40;
       font-size:20px;font-weight:700;color:var(--ink)}
  .wrap{max-width:820px;margin:0 auto;padding:84px 20px 130px}
  h1{font-size:30px;line-height:1.35;margin:10px 0 6px;font-weight:800}
  h2{font-size:24px;line-height:1.4;margin:6px 0 12px;font-weight:700}
  h2.sec{text-align:center;color:#444955;margin:4px 0 18px}
  .lead{color:var(--sub);margin-bottom:18px;font-size:17px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin:14px 0}
  .card.soft{background:var(--pale);border-color:#DCE3F4;color:#3B4A7A}
  .card.warn{background:var(--warnbg);border-color:#F3D3CF;color:var(--warnink)}
  .num{display:inline-flex;width:30px;height:30px;border-radius:8px;background:var(--slate);color:#fff;font-size:15px;font-weight:700;
       align-items:center;justify-content:center;margin-right:10px;flex:none}
  .row{display:flex;align-items:center;gap:4px}
  .q{font-weight:700;margin:22px 0 10px}
  .hint{font-size:15px;color:var(--faint)}
  .bubble{display:inline-block;position:relative;border:1px solid var(--line);background:#fff;border-radius:8px;
          padding:6px 12px;font-size:15px;color:var(--sub);margin-bottom:14px}
  .bubble:after{content:"";position:absolute;left:18px;bottom:-7px;width:12px;height:12px;background:#fff;
          border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 18px;cursor:pointer;min-height:52px;transition:all .15s}
  .chip.on{border-color:var(--slate);background:linear-gradient(135deg,var(--slate),var(--slate2));color:#fff;font-weight:600}
  .chip:active{transform:scale(.97)}
  .glabel{font-size:15px;color:var(--sub);margin:16px 0 8px;font-weight:700}
  .scale{display:grid;grid-template-columns:repeat(11,1fr);gap:6px}
  .scale button{border:1px solid var(--line);background:#fff;border-radius:10px;height:56px;cursor:pointer;font-weight:700}
  .scale button.on{background:linear-gradient(135deg,var(--slate),var(--slate2));border-color:var(--slate);color:#fff}
  .ends{display:flex;justify-content:space-between;font-size:14px;color:var(--faint);margin-top:4px}
  .add{display:flex;gap:8px;margin-top:12px}
  .add input,.field{flex:1;border:1px solid #D6DAE2;border-radius:10px;padding:12px 14px;background:#fff;min-height:54px;width:100%}
  .add input:focus,.field:focus{outline:none;border-color:var(--g1);box-shadow:0 0 0 3px rgba(63,91,196,.12)}
  .btn{border:none;border-radius:10px;padding:14px 22px;cursor:pointer;font-weight:700;min-height:56px}
  .btn.main{background:linear-gradient(135deg,var(--slate),var(--slate2));color:#fff}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--sub)}
  .btn.small{min-height:46px;padding:10px 16px;font-size:16px}
  .btn:disabled{opacity:.4;cursor:default}
  .nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 20px;z-index:40}
  .nav .in{max-width:820px;margin:0 auto;display:flex;gap:12px}
  .nav .btn{flex:1}
  .nav .btn.ghost{flex:0 0 32%}
  .reply{margin-top:12px;padding:14px 16px;border-radius:10px;background:var(--pale);color:var(--paleink);font-size:17px;
         border-left:4px solid var(--g1)}
  .form{display:flex;gap:14px;align-items:stretch;margin:16px 0}
  .form .lab{flex:none;width:84px;border-radius:10px;background:var(--slate);color:#fff;font-weight:700;
             display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:18px}
  .form .body{flex:1;min-width:0}
  .hero{border-radius:16px;padding:30px 28px;color:#fff;background:linear-gradient(120deg,var(--g1),var(--g2));margin-bottom:18px}
  .hero small{display:block;opacity:.85;font-size:14px;letter-spacing:.02em}
  .hero h1{color:#fff;margin:6px 0 6px}
  .hero p{opacity:.92;font-size:17px}
  .sess{display:flex;gap:14px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:#fff;
        border-radius:12px;padding:14px 16px;margin:8px 0;cursor:pointer}
  .sess:hover{background:var(--pale);border-color:#D3DCF2}
  .sess .n{flex:none;width:46px;height:46px;border-radius:10px;background:var(--slate);color:#fff;font-weight:800;
           font-size:18px;display:flex;align-items:center;justify-content:center}
  .sess .t{font-weight:700;font-size:19px}
  .sess .s{font-size:15px;color:var(--sub)}
  .foot{margin-top:26px;font-size:14px;color:var(--faint);text-align:center}
  .foot a{color:var(--faint)}
  .lcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px 28px;text-align:center;min-height:300px;
         display:flex;flex-direction:column;justify-content:center;gap:22px}
  .lnum{font-size:14px;color:var(--faint);font-weight:700}
  .key{font-size:27px;font-weight:800;line-height:1.45;color:var(--ink)}
  .key em{font-style:normal;color:var(--g1)}
  .lsub{font-size:18px;color:var(--sub);line-height:1.6}
  .dots{display:flex;gap:8px;justify-content:center;margin-top:16px}
  .dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
  .dots i.on{background:var(--slate);width:24px;border-radius:9px}
  .flow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px}
  .flow span{background:var(--pale);color:var(--paleink);border-radius:10px;padding:10px 14px;font-weight:700;font-size:17px}
  .flow b{color:var(--faint);font-size:20px}
  .loop{font-size:15px;color:var(--faint)}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left}
  .duo>div{border:1px solid var(--line);border-radius:12px;padding:16px}
  .duo>div.hi{border-color:var(--slate);background:linear-gradient(135deg,var(--slate),var(--slate2));color:#fff}
  .duo>div.hi .dl{color:#C9CFE3}
  .duo .dl{font-size:14px;color:var(--faint);font-weight:700;margin-bottom:6px}
  .duo .dt{font-size:18px;font-weight:700;line-height:1.5}
  .vlist{text-align:left;display:flex;flex-direction:column;gap:10px;max-width:520px;margin:0 auto;width:100%}
  .vlist>div{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:18px;font-weight:600}
  .vlist i{flex:none;font-style:normal;width:28px;height:28px;border-radius:8px;background:var(--pale);color:var(--paleink);
           display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
  .pairs{display:flex;flex-direction:column;gap:10px;max-width:520px;margin:0 auto;width:100%}
  .pairs>div{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;font-size:18px}
  .pairs .l{text-align:right;color:var(--sub)}
  .pairs .r{text-align:left;font-weight:800;color:var(--paleink);background:var(--pale);border-radius:10px;padding:8px 12px}
  .pairs b{color:var(--faint)}
  .homeex{display:grid;gap:6px;margin:8px 0 4px}
  .homeex div{display:flex;gap:10px;background:var(--pale);border-radius:8px;padding:8px 12px;font-size:16px}
  .homeex b{flex:none;width:52px;color:var(--paleink)}
  .extable{width:100%;max-width:480px;margin:0 auto;border-collapse:separate;border-spacing:0 8px;text-align:left;font-size:18px}
  .extable th{font-size:14px;color:var(--faint);font-weight:700;padding:0 14px}
  .extable td{background:var(--bg);padding:12px 14px}
  .extable td:first-child{border-radius:10px 0 0 10px} .extable td:last-child{border-radius:0 10px 10px 0;text-align:center;width:70px}
  .extable td.tl{font-weight:800;color:var(--slate);width:64px}
  .extable b{color:var(--g1)}
  .example{background:var(--bg);border-radius:12px;padding:14px 18px;font-size:19px;font-weight:700;color:var(--slate)}
  .prac{text-align:center;padding:30px 22px 24px;border:none;color:#fff;
        background:linear-gradient(135deg,#34479E 0%,#4F5FC2 45%,#7558C8 100%)}
  .orb{width:150px;height:150px;margin:6px auto 8px;border-radius:50%;
       background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.95),rgba(255,255,255,.35));opacity:.35;transform:scale(.72);
       transition:opacity .6s;box-shadow:0 0 40px rgba(255,255,255,.25)}
  .orb.go{opacity:1;animation:breathe 7s infinite}
  @keyframes breathe{
    0%{transform:scale(.72);animation-timing-function:ease-in-out}
    42.857%{transform:scale(1);animation-timing-function:ease-in-out}
    100%{transform:scale(.72)}
  }
  .vis{min-height:150px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
  .vis [hidden]{display:none!important}
  .leafbox{width:min(360px,100%);background:radial-gradient(circle at 50% 40%,#FBFDF7,#EAF1E2);border-radius:16px;padding:14px 18px 6px;
           box-shadow:0 8px 30px rgba(0,0,0,.18)}
  .ear{display:flex;align-items:center;gap:7px;height:150px}
  .ear i{display:block;width:10px;border-radius:6px;background:#fff;opacity:.85;animation:snd 1.2s ease-in-out infinite}
  .ear i:nth-child(1){height:30px;animation-delay:0s} .ear i:nth-child(2){height:60px;animation-delay:.15s}
  .ear i:nth-child(3){height:90px;animation-delay:.3s} .ear i:nth-child(4){height:60px;animation-delay:.45s}
  .ear i:nth-child(5){height:30px;animation-delay:.6s}
  .ear span{margin-left:16px;font-size:22px;font-weight:700;letter-spacing:.08em;opacity:.9}
  @keyframes snd{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
  .figbox{width:min(340px,100%);background:#fff;border-radius:16px;padding:12px 14px 10px;box-shadow:0 8px 30px rgba(0,0,0,.18);color:var(--ink)}
  .figbox.body{width:auto}
  .figbox.breath{width:auto;padding:10px 12px 8px}
  .bimg{position:relative;margin:0 auto}
  .bimg img{display:block;width:100%;height:auto}
  .bimg .iin{position:absolute;inset:0;opacity:0}
  .bimg .ov{position:absolute;inset:0;width:100%;height:100%}
  .body-view{width:240px} .nose-view{width:340px;display:none}
  .breathfig[data-mode="b-nose"] .body-view{display:none}
  .breathfig[data-mode="b-nose"] .nose-view{display:block}
  .breathfig .hl{fill:none;stroke:#F2B33D;stroke-width:4;stroke-dasharray:7 6;display:none}
  .breathfig .pre,.breathfig .ain,.breathfig .aout{display:none}
  .breathfig .pre path{stroke:#E39B12;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .breathfig .pre text{font-size:20px;font-weight:800;fill:#B07A10}
  .breathfig .ain path{stroke:#3E97DD;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .breathfig .aout path{stroke:#EA8433;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
  .breathfig .ain text{font-size:18px;font-weight:800;fill:#2A78B8}
  .breathfig .aout text{font-size:18px;font-weight:800;fill:#C2621A}
  .breathfig[data-mode="b-pose"] .hand{display:inline;animation:hlp 1.6s ease-in-out infinite}
  .breathfig[data-mode="b-pre"] .iin{opacity:1}
  .breathfig[data-mode="b-pre"] .pre{display:inline}
  .breathfig[data-mode="b-belly"] .hlBelly,.breathfig[data-mode="b-nose"] .hlNose{display:inline;animation:hlp 1.6s ease-in-out infinite}
  .breathfig[data-mode="b-nose"] .ain,.breathfig[data-mode="b-nose"] .aout{display:inline}
  .breathfig.go .iin{animation:inimg 7s infinite}
  .breathfig.go .ain{animation:ain 7s infinite}
  .breathfig.go .aout{animation:aout 7s infinite}
  @keyframes inimg{0%{opacity:0;animation-timing-function:ease-in-out}42.857%{opacity:1;animation-timing-function:ease-in-out}100%{opacity:0}}
  @keyframes ain{0%,40%{opacity:1}44%,100%{opacity:0}}
  @keyframes aout{0%,40%{opacity:0}44%,96%{opacity:1}100%{opacity:0}}
  @keyframes hlp{0%,100%{opacity:.45}50%{opacity:1}}
  .phase{position:relative;height:24px;font-size:15px;font-weight:700;color:var(--slate);text-align:center;margin-top:4px}
  .phase span{position:absolute;left:0;right:0;opacity:0}
  .breathfig.go + .phase .pin{animation:ain 7s infinite}
  .breathfig.go + .phase .pout{animation:aout 7s infinite}
  .breathfig:not(.go) + .phase{visibility:hidden}
  .vis{flex-wrap:wrap;gap:16px}
  .figbox.hour{width:270px;padding:12px 10px 8px;order:-1}
  .figbox.hour.solo{width:min(400px,100%)}
  #vhour .hs{fill:#E4E9F5;stroke:#5A6179;stroke-width:2}
  #vhour .ht{font-size:20px;fill:#9AA0AC} #vhour .ht .hn{font-size:23px;font-weight:800}
  #vhour.solo .ht{fill:var(--ink)}
  #vhour[data-stage="1"] .hs.s1,#vhour[data-stage="2"] .hs.s2,#vhour[data-stage="3"] .hs.s3{fill:#F2B33D;animation:hlp 1.6s ease-in-out infinite}
  #vhour[data-stage="1"] .ht.s1,#vhour[data-stage="2"] .ht.s2,#vhour[data-stage="3"] .ht.s3{fill:var(--ink)}
  .figbox.think{width:min(440px,100%);padding:8px 10px}
  .thinkfig [class^="m-"]{display:none}
  .thinkfig[data-mode="sp1"] .m-sp1,.thinkfig[data-mode="in-label"] .m-label,.thinkfig[data-mode="in-q"] .m-q,
  .thinkfig[data-mode="in-flow"] .m-flow,.thinkfig[data-mode="in-sub"] .m-sub{display:inline}
  .thinkfig .bb rect{fill:#fff;stroke:#7B8FE0;stroke-width:2.5}
  .thinkfig .bb .bg{font-size:24px;font-weight:800;fill:#34489A;text-anchor:middle}
  .thinkfig .bb .sm{font-size:19px;fill:#636A78;text-anchor:middle}
  .thinkfig .dots circle{fill:#fff;stroke:#7B8FE0;stroke-width:2.5}
  .thinkfig .f1,.thinkfig .f2,.thinkfig .f3,.thinkfig .f4,.thinkfig .tag{animation:pop .6s ease-out both}
  .thinkfig .f2{animation-delay:.6s} .thinkfig .f3{animation-delay:1.2s} .thinkfig .f4{animation-delay:1.8s} .thinkfig .tag{animation-delay:1.6s}
  .thinkfig .m-q .f1{animation:pop .6s ease-out both,qp 1.8s 1s ease-in-out infinite}
  .thinkfig .w1,.thinkfig .w2,.thinkfig .w3,.thinkfig .w4{opacity:0;animation:flow 8s linear infinite}
  .thinkfig .w2{animation-delay:2s} .thinkfig .w3{animation-delay:4s} .thinkfig .w4{animation-delay:6s}
  .thinkfig .subbar{fill:rgba(20,24,40,.78)}
  .thinkfig .subt{font-size:22px;font-weight:700;fill:#fff;text-anchor:middle}
  @keyframes pop{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
  @keyframes qp{0%,100%{opacity:1}50%{opacity:.55}}
  @keyframes flow{0%{opacity:0;transform:translateY(0)}12%{opacity:1}65%{opacity:1}100%{opacity:0;transform:translateY(-240px)}}
  .phase .n{display:none}
  .breathfig[data-mode="b-nose"] + .phase span{display:none}
  .breathfig[data-mode="b-nose"] + .phase .n{display:block}
  .bodyimg{width:210px}
  .bodyfig .p{fill:#F7C548;opacity:0;filter:url(#soft);transition:opacity .6s}
  .bodyfig .p.on{opacity:.6;animation:glow 2s ease-in-out infinite}
  @keyframes glow{0%,100%{opacity:.45}50%{opacity:.85}}
  .bodycap{text-align:center;font-weight:800;font-size:18px;color:var(--slate);margin-top:4px}
  .tap{display:flex;flex-direction:column;align-items:center;gap:10px}
  .pad{width:150px;height:150px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12);
       color:#fff;font-weight:700;font-size:17px;line-height:1.4;cursor:pointer;position:relative}
  .pad:focus{outline:none}
  .pad.hit{animation:hit .7s ease-out}
  @keyframes hit{0%{box-shadow:0 0 0 0 rgba(255,255,255,.7);background:rgba(255,255,255,.35)}100%{box-shadow:0 0 0 34px rgba(255,255,255,0);background:rgba(255,255,255,.12)}}
  .tapn{font-size:14px;opacity:.8}
  .pguide{margin:14px auto 0;max-width:460px;font-size:15px;line-height:1.6;background:rgba(255,255,255,.14);border-radius:10px;padding:10px 14px}
  .pguide[hidden]{display:none}
  .mouse{display:flex;flex-direction:column;align-items:center;gap:10px;animation:pop .5s ease-out both}
  #vtap:not([hidden]){animation:pop .6s ease-out both}
  .keys{display:flex;flex-direction:column;align-items:center;gap:7px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.35);
        border-radius:14px;padding:14px 14px 10px}
  .krow{display:flex;gap:6px} .krow.r1{margin-left:18px} .krow.r2{margin-left:44px}
  .kb{width:38px;height:40px;border-radius:7px;background:rgba(255,255,255,.92);color:#34479E;font-weight:800;font-size:17px;
       display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.25)}
  .kb.space{width:230px;font-size:13px;font-weight:700}
  @media (max-width:560px){.kb{width:28px;height:34px;font-size:14px}.krow{gap:4px}.krow.r1{margin-left:12px}.krow.r2{margin-left:30px}.kb.space{width:170px}.keys{padding:10px 8px 8px}}
  .kb.on{animation:keyhit 1.4s ease-out}
  @keyframes keyhit{0%{background:#F2B33D;color:#fff;transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,.25),0 0 18px #F7C548}
                     100%{background:rgba(255,255,255,.92);color:#34479E;transform:none;box-shadow:0 3px 0 rgba(0,0,0,.25)}}
  .cue{font-size:24px;font-weight:600;line-height:1.6;min-height:150px;display:flex;align-items:center;justify-content:center;padding:0 6px}
  .cue.quiet{opacity:.75;font-weight:500;font-size:20px}
  .bar{height:6px;background:rgba(255,255,255,.25);border-radius:6px;overflow:hidden;margin:18px 0 8px}
  .bar i{display:block;height:100%;width:0;background:#fff;transition:width .25s linear}
  .time{font-size:15px;opacity:.8}
  .pbtns{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .prac .btn.main{background:#fff;color:var(--g1)}
  .prac .btn.ghost{background:transparent;border-color:rgba(255,255,255,.5);color:#fff}
  .result .card{padding:0;overflow:hidden}
  .result .chead{background:linear-gradient(120deg,var(--g1),var(--g2));color:#fff;padding:18px 22px}
  .result .chead .hint{color:rgba(255,255,255,.85)}
  .result .cbody{padding:6px 22px 20px}
  .result h3{font-size:15px;color:#fff;background:var(--slate);display:inline-block;border-radius:6px;padding:2px 10px;margin:18px 0 6px}
  .result ul{padding-left:22px}
  .result .big{font-size:22px;font-weight:800}
  table.adm{width:100%;border-collapse:collapse;font-size:15px}
  table.adm th,table.adm td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left}
  .src{font-size:14px;color:var(--sub)}
  .src li{margin:4px 0}

function start(n){
  const sess = SESSIONS.find(s=>s.n===n);
  S = {sess, i:0, a:{}, t0:Date.now()}; lastRendered = -1;
  $("#topTitle").textContent = `연습 ${n}: ${sess.title}`;
  $('#top').hidden = false; $('#nav').hidden = false;
  render();
}

let lastRendered = -1;
function render(){
  stopPractice();
  const sameStep = lastRendered === S.i, y = window.scrollY;
  lastRendered = S.i;
  const st = S.sess.steps[S.i];
  const total = S.sess.steps.length;
  $('#rail').style.width = `${(S.i/(total-1))*100}%`;
  $('#prev').textContent = S.i===0 ? '← 연습 목록' : '← 이전';
  $('#next').textContent = S.i===total-1 ? '처음으로' : '다음 →';
  const fn = R[st.type];
  app.innerHTML = fn(st);
  (B[st.type]||(()=>{}))(st);
  window.scrollTo(0, sameStep ? y : 0);
}
$('#homeBtn').onclick = () => {
  if(!S || S.i===0 || confirm('연습 목록으로 돌아갈까요?\n지금까지 적은 내용은 지워집니다.')) home();
};
$('#prev').onclick = () => {
  if(!S) return;
  const st = S.sess.steps[S.i];
  if(S.i===0){ home(); return; }
  if(st.type==='learn' && (S.card||0)>0){ S.card--; lastRendered=-1; render(); return; }
  if(S.i>0){ S.i--; const p=S.sess.steps[S.i]; S.card = p.type==='learn' ? p.cards.length-1 : 0; render(); }
};
$('#next').onclick = () => {
  if(!S) return;
  const st = S.sess.steps[S.i];
  if(st.type==='learn' && (S.card||0) < st.cards.length-1){ S.card=(S.card||0)+1; lastRendered=-1; render(); return; }
  if(st.type==='feedback') saveFeedback();
  if(S.i < S.sess.steps.length-1){ S.i++; S.card=0; render(); }
  else if(confirm('카드를 휴대폰으로 찍어 두셨나요?\n처음 화면으로 돌아가면 적은 내용이 모두 지워집니다.')) home();
};

function toggle(id, v, max){
  const arr = S.a[id] = S.a[id] || [];
  const k = arr.indexOf(v);
  if(k>=0) arr.splice(k,1);
  else { if(max && arr.length>=max) arr.shift(); arr.push(v); }
}
const isOn = (id,v) => (S.a[id]||[]).includes(v);
function chipHTML(id, list){ return `<div class="chips">${list.map(v=>`<button class="chip ${isOn(id,v)?'on':''}" data-id="${id}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>`; }
function bindChips(onChange){
  app.querySelectorAll('.chip[data-id]').forEach(c=>c.onclick=()=>{
    const id=c.dataset.id, st=S.sess.steps[S.i];
    toggle(id, c.dataset.v, c.dataset.single ? 1 : (st.id===id ? st.max : 0));
    if(onChange) onChange(); else render();
  });
}
function scaleHTML(id){
  return `<div class="scale">${[...Array(11).keys()].map(k=>`<button data-sid="${id}" data-k="${k}" class="${S.a[id]===k?'on':''}">${k}</button>`).join('')}</div>`;
}

function setupPractice(script){
  const total = script.reduce((n,x)=>n+x[0],0);
  prac = {script, seg:-1, segStart:0, elapsedBefore:0, running:false, timer:null, total};
  $('#pgo').onclick = () => prac.running ? pausePractice() : resumePractice();
  $('#pskip').onclick = () => { if(prac.seg<0){ resumePractice(); return; } nextSeg(); };
  $('#pback').onclick = () => prevSeg();
}
function prevSeg(){
  if(!prac || prac.seg<=0) return;
  prac.seg--;
  prac.elapsedBefore = prac.script.slice(0, prac.seg).reduce((n,x)=>n+x[0],0);
  prac.segStart = Date.now(); prac.pausedIn = 0;
  showSeg(); drawProgress(0);
}
function drawProgress(inSeg){
  if(!prac || !$('#pbar')) return;
  const el = prac.elapsedBefore + Math.min(inSeg, prac.script[prac.seg][0]);
  $('#pbar').style.width = `${Math.min(100, el/prac.total*100)}%`;
  const left = Math.max(0, Math.ceil(prac.total-el));
  $('#ptime').textContent = `남은 시간 ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;
  $('#pback').disabled = prac.seg<=0;
}
function showSeg(){
  const [, text, breathe, quiet, vis] = prac.script[prac.seg];
  const cue = $('#cue'); if(!cue) return;
  cue.className = 'cue' + (quiet?' quiet':'');
  cue.textContent = text;
  setVis(vis);
  $('#orb').classList.toggle('go', !!breathe && prac.running && !vis);
  $('#breathfig').classList.toggle('go', !!breathe && prac.running);
  if((vis==='tap' || vis==='keys') && document.activeElement) document.activeElement.blur();
}
const SPACE_MAP = {sp0:null, sp1:'think:sp1', sp2:'b-belly', sp3:'body:all'};
function setVis(vis){
  const show = (id,on)=>{ const e=$(id); if(e) e.hidden=!on; };
  const stage = vis && vis in SPACE_MAP ? +vis.slice(2) : -1;
  if(stage>=0) vis = SPACE_MAP[vis];
  show('#vhour', stage>=0);
  if(stage>=0){ $('#vhour').dataset.stage = stage; $('#vhour').classList.toggle('solo', stage===0); }
  const breath = !!vis && vis.startsWith('b-'), body = !!vis && vis.startsWith('body:'), think = !!vis && vis.startsWith('think:');
  show('#vleaf', vis==='leaf'); show('#vear', vis==='ear'); show('#vtap', vis==='tap'); show('#vkeys', vis==='keys'); show('#vmouse', vis==='mouse');
  show('#vbreath', breath); show('#vbody', body); show('#vthink', think); show('#orb', !vis && stage<0);
  if(think) $('#thinkfig').dataset.mode = vis.slice(6);
  if(breath) $('#breathfig').dataset.mode = vis;
  if(body){
    const part = vis.slice(5);
    $('#vbody').querySelectorAll('.p').forEach(e=>e.classList.toggle('on', part==='all' || e.dataset.g===part));
    $('#bodycap').textContent = BODY_PARTS[part] || '';
  }
}
function ripple(){
  const p = $('#pad'); if(!p) return;
  p.classList.remove('hit'); void p.offsetWidth; p.classList.add('hit');
}
document.addEventListener('click', (e)=>{ if(e.target.closest && e.target.closest('#pad')) ripple(); });
document.addEventListener('keydown', (e)=>{
  if(!prac || prac.seg<0 || !prac.script[prac.seg] || prac.script[prac.seg][4]!=='keys') return;
  if(e.key===' ' || e.key==='Enter') e.preventDefault();
  const k = document.querySelector(`#vkeys [data-code="${e.code}"]`) || document.querySelector('#vkeys .space');
  if(!k) return;
  k.classList.remove('on'); void k.offsetWidth; k.classList.add('on');
});
function nextSeg(){
  if(!prac) return;
  const done = prac.script.slice(0, prac.seg+1).reduce((n,x)=>n+x[0],0);
  prac.seg++;
  prac.elapsedBefore = done; prac.segStart = Date.now(); prac.pausedIn = 0;
  if(prac.seg >= prac.script.length){ finishPractice(); return; }
  showSeg(); drawProgress(0);
}
function resumePractice(){
  $('#pback').hidden = false; $('#pskip').hidden = false; $('#pguide').hidden = true;
  prac.running = true; $('#pgo').textContent = '잠시 멈춤'; holdWake();
  if(prac.seg<0){ prac.seg=-1; nextSeg(); }
  else { prac.segStart = Date.now() - (prac.pausedIn||0); showSeg(); }
  clearInterval(prac.timer);
  prac.timer = setInterval(tick, 250);
}
function pausePractice(){
  prac.running = false; prac.pausedIn = Date.now()-prac.segStart;
  clearInterval(prac.timer); $('#pgo').textContent = '이어서'; $('#orb').classList.remove('go'); $('#breathfig').classList.remove('go');
}
function tick(){
  if(!prac || !$('#pbar')) return;
  const inSeg = (Date.now()-prac.segStart)/1000;
  const seg = prac.script[prac.seg];
  if(inSeg >= seg[0]) { nextSeg(); if(!prac || prac.seg>=prac.script.length) return; }
  drawProgress((Date.now()-prac.segStart)/1000);
}
function finishPractice(){
  clearInterval(prac.timer); prac.running=false; releaseWake();
  $('#cue').className='cue'; $('#cue').innerHTML='<span>연습을 마쳤습니다.<br>화면 아래 <b>다음</b>을 눌러 주세요.</span>';
  setVis(null); $('#orb').classList.remove('go'); $('#pbar').style.width='100%'; $('#ptime').textContent='완료';
  $('#pgo').hidden = true; $('#pskip').hidden = true; $('#pback').hidden = true;
  prac = null;
}
function stopPractice(){ if(prac){ clearInterval(prac.timer); prac=null; } releaseWake(); }
async function holdWake(){ try{ if('wakeLock' in navigator && !wake) wake = await navigator.wakeLock.request('screen'); }catch(e){} }
function releaseWake(){ try{ if(wake){ wake.release(); wake=null; } }catch(e){} }

function saveFeedback(){
  const f = S.a.fb || {};
  if(!f.help && !f.len && !(f.hard||[]).length && !f.more && !(f.text||'').trim()) return;
  const list = fbLoad();
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  list.push({id, pc:pcName(), date:today(), session:S.sess.n, help:f.help||'', len:f.len||'', hard:(f.hard||[]).join('/'), more:f.more||'', text:(f.text||'').trim()});
  fbSave(list);
  S.a.fb = {};
}

    <div class="card"><table class="adm">
      <tr><th>회기</th><th>응답</th><th>도움(1~5)</th><th>길이 짧음/적당/긺</th><th>많이 꼽은 불편</th></tr>${rows}</table>
      ${more.length?`<p class="hint" style="margin-top:10px">5회기 '계속하고 싶다': 예 ${more.filter(x=>x.more==='예').length} · 잘 모르겠다 ${more.filter(x=>x.more==='잘 모르겠다').length} · 아니오 ${more.filter(x=>x.more==='아니오').length}</p>`:''}
    </div>
    ${list.some(x=>x.text)?`<div class="card"><b>바꾸면 좋을 점 (최근 순)</b><ul class="src" style="padding-left:20px;margin-top:6px">
      ${list.filter(x=>x.text).slice(-30).reverse().map(x=>`<li>${esc(x.date)} · 연습 ${x.session} — ${esc(x.text)}</li>`).join('')}</ul></div>`:''}
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn main small" id="csv">CSV 내려받기</button>
      <button class="btn ghost small" id="clr">기록 모두 지우기</button>
      <button class="btn ghost small" id="back">← 처음으로</button>
    </div>`;
  $('#back').onclick = home;
  $('#pcSave').onclick = () => { try{ localStorage.setItem(PC_KEY, $('#pcIn').value.trim()); }catch(e){} admin(); };
  $('#clr').onclick = () => { if(confirm('저장된 피드백을 모두 지울까요? 되돌릴 수 없습니다.')){ fbSave([]); admin(); } };
  $('#csv').onclick = () => {
    const head = ['id','pc','date','session','help','len','hard','more','text'];
    const body = list.map(x=>head.map(k=>`"${String(x[k]??'').replace(/"/g,'""')}"`).join(','));
    const blob = new Blob(['﻿'+[head.join(','),...body].join('\n')], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `tms_피드백_${(pcName()||'PC').replace(/[\\/:*?"<>|\s]/g,'')}_${today()}.csv`; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  };
  window.scrollTo(0,0);
}

home();
</script>
<script>
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
</html>
